# Render blueprint: the API and its Postgres database. The web app is hosted on Vercel (client/vercel.json).
# In Render: New > Blueprint > pick this repo. Then fill in the values marked sync: false.
services:
  - type: web
    name: khanan-rakshak-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod # applies new database migrations, then starts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: khanan-rakshak-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: khanan-rakshak-db
    plan: free
    databaseName: khanan
